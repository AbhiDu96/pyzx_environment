[project]
name = "zx_env"
version = "0.1.0"
description = "Gymnasium RL environment for optimizing quantum circuits via ZX-diagram rewriting"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Alexander Mattick" },
    { name = "Maniraman Periyasamy" },
    { name = "Christian Ufrecht" },
    { name = "Abhishek Y. Dubey" },
]
requires-python = ">=3.11"
dependencies = [
    "gymnasium",
    "numpy==2.4.6",
    "pyzx==0.10.3",
    "torch",
    "torch-geometric",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zx_env"]
